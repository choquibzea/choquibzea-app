<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChoquibZea - Barbería</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-black/80 backdrop-blur border-b border-gold-500/30 p-4 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-2xl font-black tracking-wider text-yellow-500">CHOQUIBZEA</h1>
    <button id="adminAuthBtn" onclick="toggleAdminModal()" class="text-xs bg-yellow-600 hover:bg-yellow-500 text-black font-bold px-3 py-1.5 rounded transition">
      Panel Admin
    </button>
  </header>

  <main class="flex-1 max-w-xl w-full mx-auto p-4">
    <!-- Vista Cliente -->
    <section id="clientView" class="space-y-6">
      <div class="text-center py-4">
        <h2 class="text-xl font-bold">Reserva tu Cita</h2>
        <p class="text-gray-400 text-sm">Selecciona tu servicio y horario ideal</p>
      </div>

      <form id="bookingForm" onsubmit="handleBooking(event)" class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Nombre Completo</label>
          <input type="text" id="clientName" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-yellow-500" placeholder="Ej: Carlos Pérez">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Teléfono (WhatsApp)</label>
          <input type="tel" id="clientPhone" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-yellow-500" placeholder="Ej: 3001234567">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Tipo de Servicio</label>
          <select id="serviceType" onchange="updateDurationInfo()" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
            <option value="normal" data-duration="30">Corte Normal (30 min)</option>
            <option value="barba_cejas" data-duration="40">Corte + Barba / Cejas (40 min)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Fecha</label>
          <input type="date" id="bookingDate" required onchange="loadAvailableSlots()" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Hora Disponible</label>
          <select id="bookingTime" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
            <option value="">Selecciona fecha primero</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 rounded-lg transition shadow-lg">
          Confirmar Reserva
        </button>
      </form>
    </section>

    <!-- Vista Admin (Oculta por defecto) -->
    <section id="adminDashboard" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h2 class="text-xl font-bold text-yellow-400">Panel de Control (Yilmar)</h2>
        <button onclick="logoutAdmin()" class="text-xs bg-red-600 hover:bg-red-500 px-3 py-1 rounded">Cerrar Sesión</button>
      </div>

      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
        <h3 class="font-bold mb-3">Gestión de Citas</h3>
        <div id="appointmentsList" class="space-y-3">
          <p class="text-gray-400 text-sm">Cargando citas...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Login Admin -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-sm w-full space-y-4">
      <h3 class="text-lg font-bold text-center">Acceso Superusuario</h3>
      <input type="email" id="adminEmail" placeholder="Correo electrónico" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
      <input type="password" id="adminPassword" placeholder="Contraseña" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
      <div class="flex gap-2">
        <button onclick="loginAdmin()" class="flex-1 bg-yellow-500 text-black font-bold py-2 rounded">Ingresar</button>
        <button onclick="toggleAdminModal()" class="flex-1 bg-gray-600 text-white py-2 rounded">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Configuración de Firebase (Reemplaza con tus llaves de Firebase Console)
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "tu-app.firebaseapp.com",
      projectId: "tu-app-id",
      storageBucket: "tu-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Estado Auth
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('adminDashboard').classList.remove('hidden');
        document.getElementById('clientView').classList.add('hidden');
        document.getElementById('adminAuthBtn').innerText = 'Ver Vista Cliente';
        loadAdminAppointments();
      } else {
        document.getElementById('adminDashboard').classList.add('hidden');
        document.getElementById('clientView').classList.remove('hidden');
        document.getElementById('adminAuthBtn').innerText = 'Panel Admin';
      }
    });

    // Toggle Modal Login
    function toggleAdminModal() {
      if(auth.currentUser) {
        // Si ya está logueado, alterna vistas
        document.getElementById('adminDashboard').classList.toggle('hidden');
        document.getElementById('clientView').classList.toggle('hidden');
      } else {
        document.getElementById('loginModal').classList.toggle('hidden');
      }
    }

    // Login Admin
    async function loginAdmin() {
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        toggleAdminModal();
      } catch (err) {
        alert("Error de autenticación: " + err.message);
      }
    }

    function logoutAdmin() {
      auth.signOut();
    }

    // Generar horarios de 30 min (ejemplo: 9:00 AM - 7:00 PM)
    function loadAvailableSlots() {
      const selectTime = document.getElementById('bookingTime');
      selectTime.innerHTML = '';
      
      const startHour = 9;
      const endHour = 19;

      for (let h = startHour; h < endHour; h++) {
        ['00', '30'].forEach(m => {
          const timeString = `${h < 10 ? '0' + h : h}:${m}`;
          const option = document.createElement('option');
          option.value = timeString;
          option.innerText = timeString;
          selectTime.appendChild(option);
        });
      }
    }

    // Agendar Cita
    async function handleBooking(e) {
      e.preventDefault();
      const serviceSelect = document.getElementById('serviceType');
      const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];

      const appointment = {
        clientName: document.getElementById('clientName').value,
        clientPhone: document.getElementById('clientPhone').value,
        service: selectedOption.text,
        duration: parseInt(selectedOption.getAttribute('data-duration')),
        date: document.getElementById('bookingDate').value,
        time: document.getElementById('bookingTime').value,
        status: 'Pendiente',
        createdAt: new Date()
      };

      try {
        await db.collection('citas').add(appointment);
        alert('¡Cita agendada con éxito!');
        document.getElementById('bookingForm').reset();
      } catch (err) {
        alert('Error al agendar: ' + err.message);
      }
    }

    // Cargar Citas en el Admin
    function loadAdminAppointments() {
      db.collection('citas').orderBy('date', 'desc').onSnapshot(snapshot => {
        const list = document.getElementById('appointmentsList');
        list.innerHTML = '';

        if(snapshot.empty) {
          list.innerHTML = '<p class="text-gray-400">No hay citas registradas.</p>';
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const item = document.createElement('div');
          item.className = "bg-gray-700 p-3 rounded-lg flex flex-col gap-2 border-l-4 " + 
            (data.status === 'Confirmada' ? 'border-green-500' : data.status === 'Cancelada' ? 'border-red-500' : 'border-yellow-500');
          
          item.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-white">${data.clientName} <span class="text-xs text-gray-300">(${data.clientPhone})</span></p>
                <p class="text-sm text-yellow-400">${data.service} (${data.duration} min)</p>
                <p class="text-xs text-gray-300">📅 ${data.date} - ⏰ ${data.time}</p>
              </div>
              <span class="text-xs font-bold px-2 py-1 rounded bg-gray-800">${data.status}</span>
            </div>
            <div class="flex gap-2 text-xs pt-2 border-t border-gray-600">
              <button onclick="updateStatus('${doc.id}', 'Confirmada')" class="bg-green-600 hover:bg-green-500 px-2 py-1 rounded">Confirmar</button>
              <button onclick="updateStatus('${doc.id}', 'Cancelada')" class="bg-yellow-600 hover:bg-yellow-500 px-2 py-1 rounded">Cancelar</button>
              <button onclick="deleteAppointment('${doc.id}')" class="bg-red-600 hover:bg-red-500 px-2 py-1 rounded ml-auto">Eliminar</button>
            </div>
          `;
          list.appendChild(item);
        });
      });
    }

    async function updateStatus(id, newStatus) {
      await db.collection('citas').doc(id).update({ status: newStatus });
    }

    async function deleteAppointment(id) {
      if(confirm('¿Seguro que deseas eliminar esta cita?')) {
        await db.collection('citas').doc(id).delete();
      }
    }
  </script>
</body>
</html>
