<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChoquibZea - Barbería</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-black/90 backdrop-blur border-b border-yellow-500/30 p-4 flex justify-between items-center sticky top-0 z-40">
    <div>
      <h1 class="text-2xl font-black tracking-wider text-yellow-500">CHOQUIBZEA</h1>
      <p class="text-xs text-gray-400">Reserva de Citas</p>
    </div>
    <button id="adminAuthBtn" onclick="toggleAdminModal()" class="text-xs bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-3 py-1.5 rounded transition">
      Panel Admin
    </button>
  </header>

  <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-6">
    <!-- VISTA CLIENTE -->
    <section id="clientView" class="space-y-6">
      <!-- Paso 1: Selección de Servicio y Fecha -->
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4 shadow-lg">
        <h2 class="text-lg font-bold text-yellow-400 flex items-center gap-2">
          <span>1.</span> Selecciona Servicio y Fecha
        </h2>
        
        <div>
          <label class="block text-xs text-gray-400 mb-1">Servicio deseado</label>
          <select id="serviceType" onchange="renderSlots()" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-yellow-500 font-medium">
            <option value="normal" data-duration="30">Corte Normal (30 min)</option>
            <option value="barba_cejas" data-duration="40">Corte + Barba / Cejas (40 min)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Fecha</label>
          <input type="date" id="bookingDate" onchange="renderSlots()" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-yellow-500 font-medium">
        </div>
      </div>

      <!-- Paso 2: Grilla de Horarios -->
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-4 shadow-lg">
        <h2 class="text-lg font-bold text-yellow-400 flex items-center gap-2">
          <span>2.</span> Selecciona un Horario Disponible
        </h2>
        <p class="text-xs text-gray-400">Toca la hora que prefieras para agendar:</p>

        <div id="timeSlotsGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-2">
          <!-- Los botones de horario se generan con JavaScript -->
        </div>
      </div>
    </section>

    <!-- VISTA ADMIN -->
    <section id="adminDashboard" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h2 class="text-xl font-bold text-yellow-400">Panel de Control (Yilmar)</h2>
        <button onclick="logoutAdmin()" class="text-xs bg-red-600 hover:bg-red-500 px-3 py-1 rounded font-bold">Cerrar Sesión</button>
      </div>

      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3">
        <h3 class="font-bold text-lg">Citas Agendadas</h3>
        <div id="appointmentsList" class="space-y-3">
          <p class="text-gray-400 text-sm">Cargando citas...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL DE CONFIRMACIÓN DE DATOS DEL CLIENTE -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-sm w-full space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-yellow-400">Confirmar Cita</h3>
      
      <div class="bg-gray-700/50 p-3 rounded-lg text-sm space-y-1 border border-gray-600">
        <p><span class="text-gray-400">Fecha:</span> <strong id="modalSummaryDate" class="text-white">--</strong></p>
        <p><span class="text-gray-400">Hora:</span> <strong id="modalSummaryTime" class="text-yellow-400">--</strong></p>
        <p><span class="text-gray-400">Servicio:</span> <strong id="modalSummaryService" class="text-white">--</strong></p>
      </div>

      <form id="clientDetailsForm" onsubmit="confirmBooking(event)" class="space-y-3">
        <div>
          <label class="block text-xs text-gray-300 mb-1">Tu Nombre Completo</label>
          <input type="text" id="clientName" required placeholder="Ej: Carlos Pérez" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-gray-300 mb-1">Teléfono (WhatsApp)</label>
          <input type="tel" id="clientPhone" required placeholder="Ej: 3001234567" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2.5 rounded-lg transition">Agendar Ahora</button>
          <button type="button" onclick="closeBookingModal()" class="flex-1 bg-gray-600 hover:bg-gray-500 text-white py-2.5 rounded-lg transition">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL LOGIN ADMIN -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-sm w-full space-y-4">
      <h3 class="text-lg font-bold text-center text-yellow-400">Acceso Admin ChoquibZea</h3>
      <input type="email" id="adminEmail" placeholder="Correo de Yilmar" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
      <input type="password" id="adminPassword" placeholder="Contraseña" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
      <div class="flex gap-2">
        <button onclick="loginAdmin()" class="flex-1 bg-yellow-500 text-black font-bold py-2 rounded">Ingresar</button>
        <button onclick="toggleAdminModal()" class="flex-1 bg-gray-600 text-white py-2 rounded">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // Configuración de Firebase
    // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyAD6WqrWjEsM8vcMj7s6H39lXv-YNY228Q",
    authDomain: "choquibzea-d026e.firebaseapp.com",
    projectId: "choquibzea-d026e",
    storageBucket: "choquibzea-d026e.firebasestorage.app",
    messagingSenderId: "633815030883",
    appId: "1:633815030883:web:263f6e84cd4a6cfa9e2c56",
    measurementId: "G-7N6Q352SMK"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);

    // Establecer fecha de hoy por defecto en el input
    document.getElementById('bookingDate').value = new Date().toISOString().split('T')[0];

    // Control de Estado de Autenticación
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('adminDashboard').classList.remove('hidden');
        document.getElementById('clientView').classList.add('hidden');
        document.getElementById('adminAuthBtn').innerText = 'Vista Cliente';
        loadAdminAppointments();
      } else {
        document.getElementById('adminDashboard').classList.add('hidden');
        document.getElementById('clientView').classList.remove('hidden');
        document.getElementById('adminAuthBtn').innerText = 'Panel Admin';
        renderSlots();
      }
    });

    // Generar la grilla de horarios disponibles/ocupados
    async function renderSlots() {
      const selectedDate = document.getElementById('bookingDate').value;
      const grid = document.getElementById('timeSlotsGrid');
      grid.innerHTML = '<p class="col-span-full text-center text-gray-400 text-sm py-4">Cargando disponibilidad...</p>';

      if (!selectedDate) return;

      // Obtener citas existentes para el día seleccionado
      try {
        const snapshot = await db.collection('citas')
          .where('date', '==', selectedDate)
          .where('status', '!=', 'Cancelada')
          .get();

        bookedAppointments = snapshot.docs.map(doc => doc.data());
      } catch (e) {
        console.error("Error al obtener citas:", e);
        bookedAppointments = [];
      }

      grid.innerHTML = '';
      const startHour = 9;  // 9:00 AM
      const endHour = 19;   // 7:00 PM

      for (let h = startHour; h < endHour; h++) {
        ['00', '30'].forEach(m => {
          const timeString = `${h < 10 ? '0' + h : h}:${m}`;
          const isBooked = bookedAppointments.some(app => app.time === timeString);

          const btn = document.createElement('button');
          btn.type = 'button';
          
          if (isBooked) {
            btn.disabled = true;
            btn.className = 'bg-gray-700 text-gray-500 py-3 rounded-lg text-sm font-bold border border-gray-600 cursor-not-allowed line-through';
            btn.innerText = `${timeString} (Ocupado)`;
          } else {
            btn.className = 'bg-gray-800 hover:bg-yellow-500 hover:text-black text-yellow-400 py-3 rounded-lg text-sm font-bold border border-yellow-500/40 transition active:scale-95';
            btn.innerText = timeString;
            btn.onclick = () => openBookingModal(timeString);
          }

          grid.appendChild(btn);
        });
      }
    }

    // Abrir Modal de Confirmación
    function openBookingModal(time) {
      selectedSlot = time;
      const serviceSelect = document.getElementById('serviceType');
      const serviceText = serviceSelect.options[serviceSelect.selectedIndex].text;
      const dateText = document.getElementById('bookingDate').value;

      document.getElementById('modalSummaryDate').innerText = dateText;
      document.getElementById('modalSummaryTime').innerText = time;
      document.getElementById('modalSummaryService').innerText = serviceText;

      document.getElementById('bookingModal').classList.remove('hidden');
    }

    function closeBookingModal() {
      document.getElementById('bookingModal').classList.add('hidden');
    }

    // Guardar Cita en Firestore
    async function confirmBooking(e) {
      e.preventDefault();
      const serviceSelect = document.getElementById('serviceType');
      const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];

      const appointment = {
        clientName: document.getElementById('clientName').value,
        clientPhone: document.getElementById('clientPhone').value,
        service: selectedOption.text,
        duration: parseInt(selectedOption.getAttribute('data-duration')),
        date: document.getElementById('bookingDate').value,
        time: selectedSlot,
        status: 'Pendiente',
        createdAt: new Date()
      };

      try {
        await db.collection('citas').add(appointment);
        alert('¡Tu cita ha sido agendada con éxito!');
        closeBookingModal();
        document.getElementById('clientDetailsForm').reset();
        renderSlots(); // Actualizar la lista para que el turno quede ocupado
      } catch (err) {
        alert('Error al agendar: ' + err.message);
      }
    }

    // Funciones del Admin
    function toggleAdminModal() {
      if(auth.currentUser) {
        document.getElementById('adminDashboard').classList.toggle('hidden');
        document.getElementById('clientView').classList.toggle('hidden');
      } else {
        document.getElementById('loginModal').classList.toggle('hidden');
      }
    }

    async function loginAdmin() {
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        toggleAdminModal();
      } catch (err) {
        alert("Error de autenticación: " + err.message);
      }
    }

    function logoutAdmin() {
      auth.signOut();
    }

    function loadAdminAppointments() {
      db.collection('citas').orderBy('date', 'desc').onSnapshot(snapshot => {
        const list = document.getElementById('appointmentsList');
        list.innerHTML = '';

        if(snapshot.empty) {
          list.innerHTML = '<p class="text-gray-400 text-sm">No hay citas registradas.</p>';
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const item = document.createElement('div');
          item.className = "bg-gray-700 p-3 rounded-lg flex flex-col gap-2 border-l-4 " + 
            (data.status === 'Confirmada' ? 'border-green-500' : data.status === 'Cancelada' ? 'border-red-500' : 'border-yellow-500');
          
          item.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-white">${data.clientName} <span class="text-xs text-gray-300">(${data.clientPhone})</span></p>
                <p class="text-sm text-yellow-400">${data.service} (${data.duration} min)</p>
                <p class="text-xs text-gray-300">📅 ${data.date} - ⏰ ${data.time}</p>
              </div>
              <span class="text-xs font-bold px-2 py-1 rounded bg-gray-800">${data.status}</span>
            </div>
            <div class="flex gap-2 text-xs pt-2 border-t border-gray-600">
              <button onclick="updateStatus('${doc.id}', 'Confirmada')" class="bg-green-600 hover:bg-green-500 px-2 py-1 rounded font-bold">Confirmar</button>
              <button onclick="updateStatus('${doc.id}', 'Cancelada')" class="bg-yellow-600 hover:bg-yellow-500 px-2 py-1 rounded font-bold">Cancelar</button>
              <button onclick="deleteAppointment('${doc.id}')" class="bg-red-600 hover:bg-red-500 px-2 py-1 rounded font-bold ml-auto">Eliminar</button>
            </div>
          `;
          list.appendChild(item);
        });
      });
    }

    async function updateStatus(id, newStatus) {
      await db.collection('citas').doc(id).update({ status: newStatus });
    }

    async function deleteAppointment(id) {
      if(confirm('¿Seguro que deseas eliminar esta cita?')) {
        await db.collection('citas').doc(id).delete();
      }
    }
  </script>
</body>
</html>
